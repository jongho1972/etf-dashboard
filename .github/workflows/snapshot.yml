name: Build ETF snapshot

on:
  # 트리거는 j-hawk VPS cron(/etc/cron.d/etf-snapshot)이 평일 16:00 KST에
  # GitHub REST API로 호출하는 workflow_dispatch 단일 경로로 일원화한다.
  # (이전의 schedule: 0 7 * * * fallback은 GitHub schedule 큐 지연으로
  #  16:00이 아닌 19시경 중복 실행되어 제거함)
  workflow_dispatch:

concurrency:
  group: snapshot-etf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # gh workflow run deploy.yml 호출용
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build snapshot (D-1 종가 기준)
        run: python build_snapshot.py

      # 실패해도(대체 후보 없는 상장폐지 등) 스냅샷 커밋·배포는 계속하고, 디폴트는 기존 값 유지
      - name: Review What-if default
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
        run: python select_default.py --mail

      - name: Commit & push if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf_data.parquet default_portfolio.json
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="data: ETF 스냅샷 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M))"
          git diff --cached --quiet -- default_portfolio.json || msg="$msg + What-if 디폴트 자동 교체"
          git commit -m "$msg"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN으로 푸시한 커밋은 deploy.yml의 on:push를 트리거하지 못하므로
      # 변경이 있을 때 workflow_dispatch로 직접 deploy를 호출한다.
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
