name: Expert picks (weekly)

# 매주 토 09:00 KST(금요일 확정 종가 스냅샷 이후). 정시성이 필요 없어 schedule 큐 지연은 허용.
# 일요일 05:00 KST 데일리 브리핑이 변경 내용을 싣는다.
on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

concurrency:
  group: expert-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # gh workflow run deploy.yml 호출용
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 대시보드 이미지에는 넣지 않는 생성 전용 의존성
      - name: Install dependencies
        run: pip install pandas==2.3.3 pyarrow==22.0.0 anthropic==0.89.0

      # 검증 실패 시 종료코드 1 → 기존 expert_picks.json 유지(커밋·배포 안 함)
      - name: Run expert panel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python expert_picks.py

      - name: Commit & push if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expert_picks.json
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: 전문가 합의 추천 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 푸시는 deploy.yml on:push를 트리거하지 못하므로 직접 호출
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
