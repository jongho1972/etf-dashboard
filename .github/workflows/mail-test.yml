# 일회성: 디폴트 점검 메일 시크릿(GMAIL_*) 동작 확인용. 확인 후 삭제한다.
name: Mail test (one-off)

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send test mail via select_default.send_mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
        run: |
          python -c "from select_default import send_mail; send_mail('[ETF] 디폴트 점검 메일 시험', ['디폴트 자동 점검 메일 설정(GMAIL_* 시크릿) 확인용 시험 메일입니다.', '이 메일이 보이면 실제 교체·경고 알림도 정상 발송됩니다.'])" | tee out.txt
          # send_mail은 실패해도 예외를 삼키므로 출력으로 판정한다
          ! grep -qE "실패|설정 없음" out.txt
