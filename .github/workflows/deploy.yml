# etf-dashboard repo의 .github/workflows/deploy.yml 로 복사
# Secrets 필요: VPS_HOST, VPS_USER, VPS_SSH_KEY
name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: deploy-etf
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/j-hawk/etf-dashboard
            git fetch origin main
            git reset --hard origin/main
            cd /opt/j-hawk/deploy
            docker compose build etf
            docker compose up -d etf
            sleep 15
            docker compose ps etf

      - name: Healthcheck
        run: |
          for i in {1..6}; do
            if curl -fsS https://etf.jhawk.kr/_stcore/health; then
              echo "OK"; exit 0
            fi
            sleep 10
          done
          echo "Healthcheck failed"; exit 1
